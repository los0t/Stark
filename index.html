<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ハイパーボンバー</title>
<style>
:root{--bg:#0e1330;--panel:#1a2150;--tx:#f4f1ff;--or:#ff7a1a;--ye:#ffd23f;--gr:#3ddc97;--rd:#ff4d4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0;color:var(--ye)}
button,input{font:inherit;border-radius:10px;border:2px solid #3a447f;padding:10px 14px;background:var(--panel);color:var(--tx)}
button{background:var(--or);border-color:var(--or);color:#1b0e00;font-weight:700;cursor:pointer}
button.sub{background:transparent;color:var(--tx);border-color:#3a447f}
input{width:100%;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.code{font-size:40px;font-weight:800;letter-spacing:.15em;color:var(--ye)}
.pls{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.pl{background:var(--panel);border:2px solid #3a447f;border-radius:12px;padding:6px 10px;min-width:56px;text-align:center}
.pl b{display:block;font-size:12px;color:#9aa3d8}
.pl.on{border-color:var(--or);box-shadow:0 0 14px var(--or);background:#3b2410}
.fuse{height:10px;background:#2a3166;border-radius:6px;overflow:hidden}
.fuse i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ye),var(--or))}
#tm{font-size:64px;font-weight:800;text-align:center;line-height:1.1}
#tm.lo{color:var(--rd)}
h2{font-size:18px;margin:12px 0 6px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
li{display:flex;justify-content:space-between;gap:8px;background:var(--panel);border:2px solid #3a447f;border-radius:10px;padding:8px 12px;min-height:44px}
li.ok{border-color:var(--gr);background:#12382f}
li em{font-style:normal;color:var(--gr);font-weight:700}
li.hint em{color:#6a73ad;font-weight:400}
li.tap{cursor:pointer}
.big{font-size:22px;font-weight:800;text-align:center;margin:10px 0}
.bad{color:var(--rd)}
small{color:#9aa3d8}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// 問題データ: [タイトル, "表示|答え(/区切りで別解);..."]  出典: りんとちゃーの花しらべ「ネプリーグ過去問題集 2024年前期」
const RAW=[
["次のチーズの名前を答えよ","|モッツァレラ;|ゴルゴンゾーラ;|カマンベール;|チェダー;|マスカルポーネ;|ゴーダ;|リコッタ;|ミモレット;|ラクレット"],
["次の日本語訳に当てはまる英熟語を答えよ","あきらめる （　）up|give;放課後 （　）school|after;〜することができる be（　）to〜|able;ところで by the（　）|way;互いに （　）other|each;〜の世話をする take（　）of|care;今朝 （　）morning|this;実現する （　）true|come;当時 in（　）days|those"],
["次の日本史の偉人の名前を読みなさい","卑弥呼|ひみこ;厩戸皇子|うまやどのみこ;小野妹子|おののいもこ;在原業平|ありわらのなりひら;菅原道真|すがわらのみちざね;菱川師宣|ひしかわもろのぶ;田沼意次|たぬまおきつぐ;本居宣長|もとおりのりなが;大久保利通|おおくぼとしみち"],
["次の有名な条約の名前を答えなさい","南（　）条約|京;日（　）条約|米修好通商;下（　）条約|関;ポ（　）条約|ーツマス;ベ（　）条約|ルサイユ/ヴェルサイユ;サ（　）条約|ンフランシスコ平和/ンフランシスコ;核（　）条約|拡散防止;ラ（　）条約|ムサール;ワ（　）条約|シントン"],
["次の世界の観光名所がある国名を答えよ","タイムズスクエア|アメリカ;エッフェル塔|フランス;バッキンガム宮殿|イギリス;ケルン大聖堂|ドイツ;サグラダファミリア|スペイン;マチュピチュ|ペルー;イースター島|チリ;タージマハル|インド;アンコールワット|カンボジア"],
["次の定番パスタの名前を答えよ","|ナポリタン;|ペペロンチーノ;|カルボナーラ;|たらこスパゲッティ/たらこ;|ボンゴレ;|ジェノベーゼ;|ボロネーゼ;|ペスカトーレ;|アラビアータ"],
["次の日付が表す国民の祝日を答えよ","3月20日|春分の日;4月29日|昭和の日;7月15日|海の日;8月12日|山の日;9月16日|敬老の日;9月22日|秋分の日;10月14日|スポーツの日;11月3日|文化の日;11月22日|勤労感謝の日"],
["次のオリンピック開催都市がある国名を答えよ","アテネ|ギリシャ;リオデジャネイロ|ブラジル;モントリオール|カナダ;ヘルシンキ|フィンランド;ストックホルム|スウェーデン;トリノ|イタリア;リレハンメル|ノルウェー;アルベールビル|フランス;レークプラシッド|アメリカ"],
["「目」を使った慣用句の空欄を埋めよ","（　）の目にも涙|鬼;目から（　）が落ちる|うろこ/鱗;目から（　）が出る|火;目と（　）の先|鼻;目の上の（　）|たんこぶ;目（　）を立てる|くじら/鯨;目が（　）になる|点;弱り目に（　）目|祟り/たたり;目の（　）に困る|やり場"],
["広辞苑に載っている3文字の熟語。空欄を埋めよ","金（　）塔|字;青（　）井|天;絵（　）事|空;花（　）雪|吹;雪（　）花|月;目（　）見|論;猪（　）才|口;山（　）花|茶;蒲（　）英|公"],
["次の英語で書かれた料理名を和訳せよ","french fry|フライドポテト/ポテト;sunny-side up egg|目玉焼き;spring roll|春巻き;hand rolled sushi|手巻き寿司/手巻き;pork cutlet|とんかつ/豚カツ;miso soup|味噌汁/みそ汁/みそしる;deep-fried oyster|カキフライ/牡蠣フライ;beef bowl|牛丼;sweet-and-sour pork|酢豚"],
["次の「しい」で終わる言葉の読みを答えよ","騒々しい|そうぞうしい;神々しい|こうごうしい;初々しい|ういういしい;仰々しい|ぎょうぎょうしい;刺々しい|とげとげしい;猛々しい|たけだけしい;凛々しい|りりしい;瑞々しい|みずみずしい;毳々しい|けばけばしい"]
];
const Q=RAW.map(([t,s])=>[t,s.split(';').map(x=>{const[p,a]=x.split('|');return{p,a}})]);
const TIME=60000, KEY='hb_used';
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s・、。]/g,'').replace(/[ァ-ン]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/条約$/,'');
const fill=(p,a)=>p.replace(/（[^）]*）/,a);
const match=(it,x)=>{const t=norm(x);return t&&it.a.split('/').some(a=>norm(a)===t||(it.p.includes('（')&&norm(fill(it.p,a))===t))};
const getUsed=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
const setUsed=u=>{try{localStorage.setItem(KEY,JSON.stringify(u))}catch(e){}};
let role,peer,conn,S,St,recv=0;

/* ---------- 出題者 ---------- */
function host(){
  role='h';S={ph:'lobby',pl:[],it:[],c:0,title:'',wrong:null,res:null,msg:''};
  const code=String(Math.floor(1000+Math.random()*9000));
  peer=new Peer('hbomb-'+code);
  peer.on('open',()=>{S.code=code;draw()});
  peer.on('error',e=>{if(e.type==='unavailable-id')host();else alert('接続エラー: '+e.type)});
  peer.on('connection',c=>{
    c.on('data',m=>{
      if(m.t==='join'&&!S.pl.some(p=>p.c===c)){S.pl.push({c,n:String(m.n||'名無し').slice(0,12)});bc()}
      if(m.t==='ans'){const p=S.pl.find(p=>p.c===c);if(S.ph==='play'&&p&&p===cur())judge(m.x,p)}
    });
    c.on('close',()=>{if(S.ph==='lobby'||S.ph==='res'){S.pl=S.pl.filter(p=>p.c!==c);bc()}});
  });
}
const slots=()=>{const k=Math.min(5,S.pl.length),a=[...Array(k).keys()];return a.concat([...a].reverse())};
const cur=()=>{const s=slots();return s.length?S.pl[s[S.c%s.length]]:null};
function pub(p,all){
  return{ph:S.ph,code:S.code,title:S.title,c:S.c,wrong:S.wrong,res:S.res,msg:S.msg,
    rem:S.ph==='play'?S.end-Date.now():0,
    pl:S.pl.map(x=>({n:x.n})),me:S.pl.indexOf(p),cur:S.pl.indexOf(cur()),
    it:S.it.map(i=>({p:i.p,d:i.d,by:i.by,a:(all||i.d||S.ph==='res')?i.a.split('/')[0]:null}))}
}
function bc(){S.pl.forEach(p=>{if(p.c.open)p.c.send(pub(p))});draw()}
function nextQ(){
  if(!S.pl.length)return alert('参加者がまだいません');
  const used=getUsed(),av=Q.map((_,i)=>i).filter(i=>!used.includes(i));
  if(!av.length){S.msg='全問出題済みです。リセットするとまた出題できます。';S.ph='lobby';return bc()}
  const i=av[Math.floor(Math.random()*av.length)];setUsed(used.concat(i));
  S.msg='';S.title=Q[i][0];S.it=Q[i][1].map(x=>({...x,d:0}));S.c=0;S.wrong=null;S.res=null;S.ph='ready';bc();
}
function start(){S.ph='play';S.end=Date.now()+TIME;S.wrong=null;bc()}
function end(r){S.ph='res';S.res=r;bc()}
function judge(x,p){
  const i=S.it.findIndex(t=>!t.d&&match(t,x));
  if(i<0){S.wrong={n:p.n,x};bc()}else mark(i,p.n);
}
function mark(i,n){
  S.it[i].d=1;S.it[i].by=n;S.c++;S.wrong=null;
  S.it.every(t=>t.d)?end('clear'):bc();
}
function ovr(i){if(S.ph==='play'&&!S.it[i].d)mark(i,'出題者判定')}
function resetUsed(){if(confirm('出題済みの履歴をリセットして、全問を再び出題対象に戻しますか？')){setUsed([]);S.msg='リセットしました。';draw()}}

/* ---------- 参加者 ---------- */
function goJoin(){
  const n=$('#nm').value.trim(),code=$('#cd').value.trim();
  if(!n||!code)return alert('名前と部屋コードを入力してください');
  role='p';St=null;draw();
  peer=new Peer();
  peer.on('open',()=>{
    conn=peer.connect('hbomb-'+code,{reliable:true});
    conn.on('open',()=>conn.send({t:'join',n}));
    conn.on('data',s=>{St=s;recv=Date.now();draw()});
    conn.on('close',()=>{alert('出題者との接続が切れました');location.reload()});
  });
  peer.on('error',()=>{alert('部屋に接続できません。部屋コードを確認してください');location.reload()});
}
function send(){const e=$('#ans');if(e&&e.value.trim()){conn.send({t:'ans',x:e.value});e.value='';e.focus()}}

/* ---------- 表示 ---------- */
function draw(){
  if(!role){
    app.innerHTML=`<h1>💣 ハイパーボンバー</h1><p>答えが10個ある問題を、5人で順番にリレーして60秒以内に答えきれ！</p>
    <div class="row"><button onclick="host()">出題者になる</button></div><hr style="border-color:#3a447f">
    <h2>参加者として入る</h2><input id="nm" placeholder="名前" maxlength="12"><input id="cd" placeholder="部屋コード（4桁）" inputmode="numeric" value="${esc(location.hash.slice(1))}">
    <div class="row"><button onclick="goJoin()">入る</button></div>
    <small>非公式ファン作品です。問題の出典：りんとちゃーの花しらべ「ネプリーグ過去問題集」</small>`;return;
  }
  const h=role==='h',st=h?pub(null,true):St;
  if(!st){app.innerHTML='<p>接続中…</p>';return}
  const play=st.ph==='play',k=Math.min(5,st.pl.length);
  let o=h?`<div>部屋コード</div><div class="code">${esc(st.code||'…')}</div><small>参加者はこのコードを入力（URL末尾に #${esc(st.code||'')} を付けても可）</small>`:`<h1>💣 ハイパーボンバー</h1>`;
  o+=`<div class="pls">${st.pl.slice(0,5).map((p,i)=>`<div class="pl ${play&&i===st.cur?'on':''}"><b>${i+1}枠目</b>${play&&i===st.cur?'💣':''}${esc(p.n)}</div>`).join('')||'<small>参加者を待っています…</small>'}</div>`;
  if(st.pl.length>5)o+=`<small>観戦 ${st.pl.length-5}人</small>`;
  if(st.msg)o+=`<p>${esc(st.msg)}</p>`;
  if(st.ph!=='lobby'){
    o+=`<div class="fuse"><i id="fz"></i></div><div id="tm">60</div><h2>${esc(st.title)}（${st.it.length}個）</h2><ul>`+
    st.it.map((t,i)=>`<li class="${t.d?'ok':h?'hint':''} ${h&&play&&!t.d?'tap':''}" ${h&&play&&!t.d?`onclick="ovr(${i})"`:''}><span>${esc(t.p)||'?'}</span><em>${t.a!=null?esc(t.a):''}${t.d?` <small>${esc(t.by)}</small>`:''}</em></li>`).join('')+'</ul>';
    if(st.wrong)o+=`<p class="bad">✗ ${esc(st.wrong.n)}：${esc(st.wrong.x)}</p>`;
    if(st.ph==='res')o+=`<div class="big">${st.res==='clear'?'🎉 爆弾解除！ 全問正解':'💥 BOOM！ '+st.c+'個正解'}</div>`;
    if(h&&play)o+='<small>誤判定は、答えを灰色表示の項目タップで正解にできます</small>';
  }
  if(h){
    const u=getUsed().length;
    o+=`<div class="row">${st.ph==='ready'?'<button onclick="start()">スタート</button>':st.ph==='play'?'<button class="sub" onclick="end(\'boom\')">強制終了</button>':'<button onclick="nextQ()">次の問題を出す</button>'}<button class="sub" onclick="resetUsed()">出題履歴をリセット</button></div><small>出題済み ${u} / ${Q.length}問</small>`;
  }else{
    const my=st.me,mine=my>=0&&my<5,turn=play&&st.cur===my;
    o+=`<p class="big">${st.ph==='lobby'?'出題者の開始待ち':st.ph==='ready'?'問題を確認して待機…':play?(turn?'あなたの番！':esc((st.pl[st.cur]||{}).n)+'さんの番'):''}</p><small>${mine?`あなたは${my+1}枠目`:'観戦中'}（参加${st.pl.length}人）</small>`;
    if(turn)o+=`<div class="row"><input id="ans" autocomplete="off" placeholder="答えを入力" onkeydown="if(event.key==='Enter')send()" style="flex:1"><button onclick="send()">答える</button></div>`;
  }
  app.innerHTML=o;
  const e=$('#ans');if(e)e.focus();
  updT();
}
function updT(){
  const t=$('#tm');if(!t)return;
  const ph=role==='h'?S.ph:St&&St.ph;
  let r=ph==='ready'?TIME:ph==='play'?(role==='h'?S.end-Date.now():St.rem-(Date.now()-recv)):0;
  if(role==='h'&&ph==='play'&&r<=0)return end('boom');
  r=Math.max(0,r);t.textContent=Math.ceil(r/1000);t.classList.toggle('lo',r<10000);$('#fz').style.width=r/TIME*100+'%';
}
setInterval(updT,100);
draw();
</script>
</body>
</html>
