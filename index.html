 <!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ハイパーボンバー</title>
<style>
:root{--bg:#0e1330;--panel:#1a2150;--tx:#f4f1ff;--or:#ff7a1a;--ye:#ffd23f;--gr:#3ddc97;--rd:#ff4d4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0;color:var(--ye)}
button,input{font:inherit;border-radius:10px;border:2px solid #3a447f;padding:10px 14px;background:var(--panel);color:var(--tx)}
button{background:var(--or);border-color:var(--or);color:#1b0e00;font-weight:700;cursor:pointer}
button.sub{background:transparent;color:var(--tx);border-color:#3a447f}
input{width:100%;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.code{font-size:40px;font-weight:800;letter-spacing:.15em;color:var(--ye)}
.pls{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.pl{background:var(--panel);border:2px solid #3a447f;border-radius:12px;padding:6px 10px;min-width:56px;text-align:center}
.pl b{display:block;font-size:12px;color:#9aa3d8}
.pl.on{border-color:var(--or);box-shadow:0 0 14px var(--or);background:#3b2410}
.fuse{height:10px;background:#2a3166;border-radius:6px;overflow:hidden}
.fuse i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ye),var(--or))}
#tm{font-size:64px;font-weight:800;text-align:center;line-height:1.1}
#tm.lo{color:var(--rd)}
h2{font-size:18px;margin:12px 0 6px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
li{display:flex;justify-content:space-between;gap:8px;background:var(--panel);border:2px solid #3a447f;border-radius:10px;padding:8px 12px;min-height:44px}
li.ok{border-color:var(--gr);background:#12382f}
li em{font-style:normal;color:var(--gr);font-weight:700}
li.hint em{color:#c9d0ff;font-weight:700}
li.tap{cursor:pointer}
.big{font-size:22px;font-weight:800;text-align:center;margin:10px 0}
.bad{color:var(--rd)}
small{color:#9aa3d8}
.q{text-align:center;font-weight:800;font-size:20px;margin:6px 0}
.q small{display:block;color:var(--ye);font-size:14px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;margin:6px 0}
.me{font-size:13px;color:#9aa3d8}
.tmw{text-align:center}.tmw small{display:block}.tmw #tm{font-size:48px}
.cur{justify-self:end;text-align:right;border:2px solid #3a447f;border-radius:10px;padding:4px 10px;max-width:100%}
.cur.on{border-color:var(--or);box-shadow:0 0 12px var(--or)}
.cur small{display:block;color:#9aa3d8;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0;perspective:800px}
.card{background:#fff;color:#000;border:4px solid #000;border-radius:6px;min-height:88px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-weight:800;word-break:break-all}
.card.rev{padding:0;flex-direction:column;align-items:stretch;justify-content:stretch}
.card.rev .cy{background:#e3c514;padding:5px 4px;text-align:center;border-bottom:3px solid #000}
.card.rev .ca{flex:1;display:flex;align-items:center;justify-content:center;color:#ff1a1a;padding:4px}
.card{position:relative}
.no{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#000;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:1}
.card.rev .no{background:#fff;color:#000;top:2px;left:3px}
.card.miss{opacity:.55}
.card.new{animation:fl .6s ease}
@keyframes fl{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
#as{position:fixed;right:56px;bottom:14px;max-width:70vw;font-size:12px;font-weight:700;color:#1b0e00;background:var(--ye);padding:4px 8px;border-radius:8px;display:none;z-index:9}
#mt{position:fixed;right:10px;bottom:10px;padding:6px 10px;opacity:.85;background:var(--bg)}
</style>
</head>
<body>
<div id="app"></div>
<span id="as" onclick="tapPlay()"></span><button id="mt" class="sub" onclick="togMute()">🔊</button>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

["次の東京に関する問題に答えよ","都庁がある区|新宿区;東京で最も高い建造物|東京スカイツリー;東京唯一の国際空港|羽田空港;東京で最も利用者の多いJRの駅|新宿駅;最も登山客の多い都内の山|高尾山;東京本拠地のプロ野球チーム（読売ジャイアンツともう1つ）|東京ヤクルトスワローズ;「都民の日」は何月何日|10月1日;東京で最も人口の多い市|八王子市;都内最古の寺|浅草寺"],
["次のITの略語のカタカナ読みを答えよ","SNS＝（　）ネットワーク|ソーシャル;SMS＝（　）メッセージサービス|ショート;GPS＝（　）ポジショニングシステム|グローバル;LAN＝（　）エリアネットワーク|ローカル;HDD＝ハードディスク（　）|ドライブ;USB＝（　）シリアルバス|ユニバーサル;WWW＝（　）ワイドウェブ|ワールド;AI＝アーティフィシャル（　）|インテリジェンス;5G＝ファイブ（　）|ジェネレーション"],
["次の日本語の読みを答えよ（難読語）","婉曲|えんきょく;きめ細か|きめこまか;職人気質|しょくにんかたぎ;喧喧囂囂|けんけんごうごう;身を粉にして|みをこにして;行脚|あんぎゃ;遊説|ゆうぜい;七五三縄|しめなわ;二進も三進も|にっちもさっちも"],
["下線部を正しい言葉に訂正せよ","友人と将棋を「打つ」|指す;上には上が「いる」|ある;部長の「お目」にかなう|お眼鏡;ライバルに「足元」をすくわれる|足;彼に白羽の矢が「当たる」|立つ;競馬の熱に「うなされる」|浮かされる"],
["次の日本語を英訳せよ","喧嘩|fight;キツネ|fox;引き分け|draw;ひつじ|sheep;四角形|square;歯|tooth;海老|shrimp;島|island;香水|perfume"],
["次の言葉を英語で答えよ","涙|tears;柿|persimmon;化粧|make up;首相|prime minister;偽物|fake;さじ|spoon"],
["次の英文が表す四字熟語・ことわざを答えよ","kill two birds with one stone|一石二鳥;one good deed a day|一日一善;action, not words.|不言実行;time is money.|時は金なり;seeing is believing.|百聞は一見にしかず;all is well that ends well|終わりよければすべてよし"],
["次のご当地名物がある都道府県名を答えよ","夕張メロン|北海道;松阪牛ステーキ|三重県;宇都宮餃子|栃木県;きりたんぽ|秋田県;ほうとう|山梨県;信州そば|長野県;網焼き牛たん弁当|宮城県;いかめし|北海道;松阪牛めし|三重県;ますのすし|富山県;米沢牛炭火焼特上カルビ弁当|山形県;あなごめし|広島県"],
["次の鉄道が走る都道府県名を答えよ","江ノ島電鉄|神奈川県;銚子電鉄|千葉県;阪堺電車|大阪府;南阿蘇鉄道|熊本県;秩父鉄道|埼玉県;高松琴平電鉄|香川県"],
["次の有名な観光地の名前を正しく読め","北谷（沖縄県）|ちゃたん;美瑛（北海道）|びえい;三田（兵庫県）|さんだ;長万部（北海道）|おしゃまんべ;石廊崎（静岡県）|いろうざき"]
];
const Q=RAW.map(([t,s])=>[t,s.split(';').map(x=>{const[p,a]=x.split('|');return{p,a}})]);
const TIME=60000, LEAD=5000, KEY='hb_used';
const aud=new Audio('bgm.mp3');aud.preload='auto';let mute=false,started=false;
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getUsed=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
const setUsed=u=>{try{localStorage.setItem(KEY,JSON.stringify(u))}catch(e){}};
let role,peer,conn,S,St,recv=0;

/* ---------- 出題者 ---------- */
function host(){
  unlock();role='h';S={ph:'lobby',pl:[],it:[],c:0,title:'',wrong:null,res:null,msg:''};
  const code=String(Math.floor(1000+Math.random()*9000));
  peer=new Peer('hbomb-'+code);
  peer.on('open',()=>{S.code=code;draw()});
  peer.on('error',e=>{if(e.type==='unavailable-id')host();else alert('接続エラー: '+e.type)});
  peer.on('connection',c=>{
    c.on('data',m=>{
      if(m.t==='join'&&!S.pl.some(p=>p.c===c)){S.pl.push({c,n:String(m.n||'名無し').slice(0,12)});bc()}
    });
    c.on('close',()=>{if(S.ph==='lobby'||S.ph==='res'){S.pl=S.pl.filter(p=>p.c!==c);bc()}});
  });
}
const slots=()=>{const k=Math.min(5,S.pl.length),a=[...Array(k).keys()];return a.concat([...a].reverse())};
const cur=()=>{const s=slots();return s.length?S.pl[s[S.c%s.length]]:null};
function pub(p,all){
  return{ph:S.ph,code:S.code,title:S.title,c:S.c,wrong:S.wrong,res:S.res,msg:S.msg,
    rem:S.ph==='play'?S.end-Date.now():0,
    pl:S.pl.map(x=>({n:x.n})),me:S.pl.indexOf(p),cur:S.pl.indexOf(cur()),
    it:S.it.map(i=>({p:i.p,d:i.d,by:i.by,a:(all&&!i.d)?i.a.replace(/\//g,'／'):(i.d||S.ph==='res')?i.a.split('/')[0]:null}))}
}
function bc(){S.pl.forEach(p=>{if(p.c.open)p.c.send(pub(p))});draw()}
function nextQ(){
  if(!S.pl.length)return alert('参加者がまだいません');
  const used=getUsed(),av=Q.map((_,i)=>i).filter(i=>!used.includes(i));
  if(!av.length){S.msg='全問出題済みです。リセットするとまた出題できます。';S.ph='lobby';return bc()}
  const i=av[Math.floor(Math.random()*av.length)];setUsed(used.concat(i));
  S.msg='';S.title=Q[i][0];S.it=Q[i][1].map(x=>({...x,d:0}));S.c=0;S.wrong=null;S.res=null;S.ph='ready';bc();
}
function start(){S.ph='play';S.end=Date.now()+LEAD+TIME;S.wrong=null;bc()}
function end(r){S.ph='res';S.res=r;bc()}
function mark(i,n){
  S.it[i].d=1;S.it[i].by=n;S.c++;S.wrong=null;
  S.it.every(t=>t.d)?end('clear'):bc();
}
function ovr(i){if(S.ph==='play'&&!S.it[i].d)mark(i,(cur()||{}).n||'')}
function resetUsed(){if(confirm('出題済みの履歴をリセットして、全問を再び出題対象に戻しますか？')){setUsed([]);S.msg='リセットしました。';draw()}}

/* ---------- 参加者 ---------- */
function goJoin(){
  const n=$('#nm').value.trim(),code=$('#cd').value.trim();
  if(!n||!code)return alert('名前と部屋コードを入力してください');
  unlock();role='p';St=null;draw();
  peer=new Peer();
  peer.on('open',()=>{
    conn=peer.connect('hbomb-'+code,{reliable:true});
    conn.on('open',()=>conn.send({t:'join',n}));
    conn.on('data',s=>{St=s;recv=Date.now();draw()});
    conn.on('close',()=>{alert('出題者との接続が切れました');location.reload()});
  });
  peer.on('error',()=>{alert('部屋に接続できません。部屋コードを確認してください');location.reload()});
}

/* ---------- 表示 ---------- */
function draw(){
  if(!role){
    app.innerHTML=`<h1>💣 ハイパーボンバー</h1><p>答えが10個ある問題を、5人で順番にリレーして60秒以内に答えきれ！</p>
    <div class="row"><button onclick="host()">出題者になる</button></div><hr style="border-color:#3a447f">
    <h2>参加者として入る</h2><input id="nm" placeholder="名前" maxlength="12"><input id="cd" placeholder="部屋コード（4桁）" inputmode="numeric" value="${esc(location.hash.slice(1))}">
    <div class="row"><button onclick="goJoin()">入る</button></div>
    <small>非公式ファン作品です。問題の出典：りんとちゃーの花しらべ「ネプリーグ過去問題集」</small>`;return;
  }
  const h=role==='h',st=h?pub(null,true):St;
  if(!st){app.innerHTML='<p>接続中…</p>';return}
  if(!h){drawP(st);return}
  const play=st.ph==='play',k=Math.min(5,st.pl.length);
  let o=h?`<div>部屋コード</div><div class="code">${esc(st.code||'…')}</div><small>参加者はこのコードを入力（URL末尾に #${esc(st.code||'')} を付けても可）</small>`:`<h1>💣 ハイパーボンバー</h1>`;
  o+=`<div class="pls">${st.pl.slice(0,5).map((p,i)=>`<div class="pl ${play&&i===st.cur?'on':''}"><b>${i+1}枠目</b>${play&&i===st.cur?'💣':''}${esc(p.n)}</div>`).join('')||'<small>参加者を待っています…</small>'}</div>`;
  if(st.pl.length>5)o+=`<small>観戦 ${st.pl.length-5}人</small>`;
  if(st.msg)o+=`<p>${esc(st.msg)}</p>`;
  if(st.ph!=='lobby'){
    o+=`<div class="fuse"><i id="fz"></i></div><div id="tm">60</div><h2>${esc(st.title)}（${st.it.length}個）</h2><ul>`+
    st.it.map((t,i)=>`<li class="${t.d?'ok':h?'hint':''} ${h&&play&&!t.d?'tap':''}" ${h&&play&&!t.d?`onclick="ovr(${i})"`:''}><span>${esc(t.p)||'?'}</span><em>${t.a!=null?esc(t.a):''}${t.d?` <small>${esc(t.by)}</small>`:''}</em></li>`).join('')+'</ul>';
    if(st.ph==='res')o+=`<div class="big">${st.res==='clear'?'🎉 爆弾解除！ 全問正解':'💥 BOOM！ '+st.c+'個正解'}</div>`;
    if(h&&play)o+='<small>参加者が通話で答えて合っていたら、その項目をタップして○にします</small>';
  }
  if(h){
    const u=getUsed().length;
    o+=`<div class="row">${st.ph==='ready'?'<button onclick="start()">スタート</button>':st.ph==='play'?'<button class="sub" onclick="end(\'boom\')">強制終了</button>':'<button onclick="nextQ()">次の問題を出す</button>'}<button class="sub" onclick="resetUsed()">出題履歴をリセット</button></div><small>出題済み ${u} / ${Q.length}問</small>`;
  }else{
    const my=st.me,mine=my>=0&&my<5,turn=play&&st.cur===my;
    o+=`<p class="big">${st.ph==='lobby'?'出題者の開始待ち':st.ph==='ready'?'問題を確認して待機…':play?(turn?'あなたの番！声で答えよう':esc((st.pl[st.cur]||{}).n)+'さんの番'):''}</p><small>${mine?`あなたは${my+1}枠目`:'観戦中'}（参加${st.pl.length}人）</small>`;
  }
  app.innerHTML=o;
  const e=$('#ans');if(e)e.focus();
  updT();
}
let prevD=[],prevK='';
function drawP(st){
  const play=st.ph==='play',my=st.me,mine=my>=0&&my<5,turn=play&&st.cur===my;
  const meT=mine?`あなたは<b>${my+1}</b>枠目`:'観戦中';
  if(st.ph==='lobby'){app.innerHTML=`<h1>💣 ハイパーボンバー</h1><p class="big">${esc(st.msg||'出題者の開始待ち')}</p><small>${meT}（参加${st.pl.length}人）</small>`;return}
  const k=st.title+st.it.length;if(k!==prevK){prevD=[];prevK=k}
  const cur=play&&st.pl[st.cur]?st.pl[st.cur].n:'—';
  const cards=st.it.map((t,i)=>{
    const rev=t.d||st.ph==='res',f=x=>x.length>14?13:x.length>8?17:24,g=x=>x.length>14?11:x.length>8?13:15;
    const no=`<span class="no">${i+1}</span>`;
    if(!rev)return `<div class="card" style="font-size:${f(t.p)}px">${no}${esc(t.p)}</div>`;
    return `<div class="card rev ${t.d?'':'miss'} ${prevD[i]?'':'new'}">${no}<div class="cy" style="font-size:${g(t.p)}px">${esc(t.p)}</div><div class="ca" style="font-size:${f(String(t.a))}px">${esc(t.a)}</div></div>`;
  }).join('');
  prevD=st.it.map(t=>!!(t.d||st.ph==='res'));
  app.innerHTML=`<div class="q"><small>【問題】</small>${esc(st.title)}</div>
  <div class="bar"><div class="me">${meT}</div><div class="tmw"><small>制限時間</small><div id="tm">60</div></div><div class="cur ${turn?'on':''}"><small>回答者</small><b>${play?'💣 ':''}${esc(cur)}</b></div></div>
  <div class="fuse"><i id="fz"></i></div>
  <div class="grid">${cards}</div>
  ${st.ph==='res'?`<div class="big">${st.res==='clear'?'🎉 爆弾解除！':'💥 BOOM！ '+st.c+'個正解'}</div>`:''}
  <p class="big">${play?esc(cur)+'のターン！':st.ph==='ready'?'問題を確認して待機…':''}</p>`;
  updT();
}
function updT(){
  const t=$('#tm');if(!t)return;
  const ph=role==='h'?S.ph:St&&St.ph;
  let r=ph==='ready'?TIME:ph==='play'?(role==='h'?S.end-Date.now():St.rem-(Date.now()-recv)):0;
  if(role==='h'&&ph==='play'&&r<=0)return end('boom');
  r=Math.max(0,Math.min(TIME,r));t.textContent=Math.ceil(r/1000);t.classList.toggle('lo',r<10000);$('#fz').style.width=r/TIME*100+'%';
}
let unlocked=false;
function unlock(){
  if(unlocked)return;unlocked=true;
  try{const p=aud.play();if(p&&p.catch)p.catch(()=>{});aud.pause();aud.currentTime=0}catch(e){}
}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function togMute(){mute=!mute;aud.muted=mute;$('#mt').textContent=mute?'🔇':'🔊'}
let blocked=false;
function say(t,click){const e=$('#as');if(!e)return;e.textContent=t;e.style.display=t?'block':'none';e.style.cursor=click?'pointer':'default'}
aud.addEventListener('error',()=>say('⚠ 音声ファイル bgm.mp3 が読み込めません（ファイル名と置き場所を確認）'));
function startAudio(){
  const rem=role==='h'?S.end-Date.now():St.rem-(Date.now()-recv);
  try{aud.currentTime=Math.min(LEAD+TIME,Math.max(0,(LEAD+TIME-rem)/1000))}catch(e){}
  const p=aud.play();
  if(p&&p.then)p.then(()=>{blocked=false;say('')}).catch(e=>{
    if(e&&e.name==='NotAllowedError'){blocked=true;say('🔊 ここをタップして音楽を有効化',true)}
    else if(!aud.error)say('⚠ 再生できません（'+(e&&e.name)+'）');
  });
}
function tapPlay(){if(blocked&&started)startAudio()}
function audioSync(){
  const ph=role==='h'?(S&&S.ph):(St&&St.ph);
  if(ph==='play'){if(!started){started=true;startAudio()}}
  else{started=false;if(blocked){blocked=false;say('')}if(!aud.paused)aud.pause()}
}
setInterval(()=>{audioSync();updT()},100);
draw();
</script>
